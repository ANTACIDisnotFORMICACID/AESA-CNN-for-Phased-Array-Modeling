[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aesa-cnn-v29"
version = "0.2.0"
description = "V2.9 staged physics-layered 4x4 far-field model trained from amplitude only"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "torch>=2.2",
]

[project.scripts]
v29-prepare-hfss = "v29.cli.prepare_hfss_data:main"
v29-prepare-hfss-amplitude = "v29.cli.prepare_hfss_amplitude:main"
v29-prepare-measured-amplitude = "v29.cli.prepare_measured_amplitude:main"
v29-prepare-amplitude-split = "v29.cli.prepare_amplitude_split:main"
v29-train-forward = "v29.cli.train_forward:main"
v29-evaluate-forward = "v29.cli.evaluate_forward:main"
v29-optimize-targets = "v29.cli.optimize_targets:main"
v29-verify-hfss-basis = "v29.cli.verify_hfss_basis:main"
v29-diagnose-structure = "v29.cli.diagnose_structure:main"

[project.optional-dependencies]
test = ["pytest>=8"]
hfss = ["scikit-rf>=1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
