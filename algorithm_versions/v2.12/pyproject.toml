[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aesa-cnn-v212-operator"
version = "0.1.0"
description = "Filtration SSH and coherent rank-one operator learning for AESA-CNN"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

