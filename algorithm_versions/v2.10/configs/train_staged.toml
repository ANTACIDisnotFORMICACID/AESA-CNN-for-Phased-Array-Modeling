[training]
total_epochs = 200
recommended_strategy = "joint"
queries_per_epoch = 8192
batch_size = 1024
validation_batch_size = 2048
learning_rate = 1e-3

[training.stage_fraction]
# Retained as a controlled ablation. The first HFSS run showed that only 20
# joint epochs underfit; the trained V2.10 baseline therefore uses joint=200.
nominal = 0.40
coupling = 0.20
residual = 0.30
joint = 0.10

[training.loss]
db_loss_weight = 0.03
power_loss_weight = 0.10
residual_energy_weight = 1e-4
coupling_l2_weight = 1e-4
reciprocity_weight = 1e-3

